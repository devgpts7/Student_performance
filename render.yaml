services:
  - type: web
    name: gradeiq-predictor
    env: python
    buildCommand: pip install -r requirements.txt && python data/generate_dataset.py && python utils/model_trainer.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
